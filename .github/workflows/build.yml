name: Build Nekogram
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install -y nasm ninja-build
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nekogram-apk
          path: TMessagesProj/build/outputs/apk/**/*.apk